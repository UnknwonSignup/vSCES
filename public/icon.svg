<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e3af2"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="32" height="32" rx="6" fill="#0b0910"/>

  <!-- === GRASS BLOCK PIXEL ART (purple) === -->
  <!-- Top face (grass, purple gradient 3D top) -->
  <!-- 10x10 top face area, 3px offset each side, perspective -->
  
  <!-- Top face - purple grass pixels 6x6 pixel block top -->
  <!-- Using a simplified pixelated grass block in purple -->
  
  <!-- Block body (dirt = dark purple) -->
  <rect x="5" y="17" width="22" height="12" fill="#2d1b4e"/>
  <rect x="5" y="17" width="22" height="1"  fill="#3d2a5e"/>
  <rect x="5" y="17" width="1"  height="12" fill="#3d2a5e"/>
  <rect x="26" y="17" width="1" height="12" fill="#1a0e30"/>
  <rect x="5" y="28" width="22" height="1"  fill="#1a0e30"/>

  <!-- Dirt texture dots -->
  <rect x="8"  y="19" width="2" height="2" fill="#3a2258"/>
  <rect x="13" y="21" width="2" height="2" fill="#3a2258"/>
  <rect x="18" y="19" width="2" height="2" fill="#3a2258"/>
  <rect x="22" y="23" width="2" height="2" fill="#3a2258"/>
  <rect x="10" y="24" width="2" height="2" fill="#3a2258"/>
  <rect x="20" y="25" width="2" height="2" fill="#1e1040"/>
  <rect x="7"  y="26" width="2" height="1" fill="#1e1040"/>

  <!-- Top face (grass = vivid purple) -->
  <rect x="5" y="11" width="22" height="7" fill="url(#g1)"/>

  <!-- Grass top texture - lighter and darker purple pixels -->
  <rect x="5"  y="11" width="3" height="2" fill="#d946ef"/>
  <rect x="10" y="11" width="2" height="3" fill="#c026d3"/>
  <rect x="15" y="11" width="3" height="2" fill="#e879f9"/>
  <rect x="20" y="11" width="2" height="3" fill="#d946ef"/>
  <rect x="24" y="11" width="3" height="2" fill="#c026d3"/>
  <rect x="7"  y="12" width="2" height="2" fill="#9333ea"/>
  <rect x="13" y="13" width="2" height="1" fill="#7e22ce"/>
  <rect x="18" y="12" width="2" height="2" fill="#9333ea"/>
  <rect x="23" y="13" width="2" height="1" fill="#7e22ce"/>

  <!-- Grass/dirt transition strip -->
  <rect x="5"  y="16" width="22" height="2" fill="#7c3aed"/>
  <rect x="6"  y="16" width="2"  height="1" fill="#8b5cf6"/>
  <rect x="12" y="16" width="3"  height="1" fill="#6d28d9"/>
  <rect x="19" y="16" width="2"  height="1" fill="#8b5cf6"/>
  <rect x="24" y="16" width="2"  height="1" fill="#6d28d9"/>
</svg>
